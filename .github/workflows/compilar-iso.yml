name: Compilar y publicar la ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión de AyusOS (por ejemplo, 1.3)
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espacio e instalar live-build
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y gnupg live-build debootstrap debian-archive-keyring squashfs-tools xorriso isolinux syslinux-efi grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - name: Compilar
        run: |
          set -euo pipefail
          sed -i "s/^version=.*/version=$VERSION/" construir.sh
          sudo ./construir.sh
          cat compilacion.*/config/includes.chroot/etc/ayusos-aio-version
      - name: Publicar la versión
        run: |
          set -euo pipefail
          iso="AyusOS-Linux-$VERSION-amd64.iso"
          mkdir out
          mv "$iso" "$iso.sha256" out/
          cd out
          if (( $(stat -c %s "$iso") > 2000000000 )); then
            split -b 1900M -d -a 2 --numeric-suffixes=1 "$iso" "$iso.part-"
            rm "$iso"
          fi
          aio=$(sudo cat ../compilacion.*/config/includes.chroot/etc/ayusos-aio-version | cut -d= -f2)
          gh release create "v$VERSION" --title "AyusOS Linux $VERSION" \
            --notes "Fondos de pantalla claro y oscuro con la marca de AyusOS. Integra AiO Debian GUI $aio, la última versión estable en el momento de la compilación." \
            -- * 
          gh workflow run sourceforge.yml -f tag="v$VERSION"
