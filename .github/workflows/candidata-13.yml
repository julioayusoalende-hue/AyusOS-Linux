name: Candidata 1.3 sobre AyusOS 1.2

on:
  push:
    branches: [correccion/1.3]

permissions:
  contents: read

jobs:
  remaster:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtener la ISO oficial 1.2
        run: |
          set -euo pipefail
          df -h .
          gh release download v1.2 --pattern '*.iso.part-0[12]'
          cat AyusOS-Linux-1.2-amd64.iso.part-0{1,2} > base.iso
          rm -- AyusOS-Linux-1.2-amd64.iso.part-0{1,2}
      - name: Remasterizar sin recrear el escritorio ni el instalador
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools
          sudo bash remaster/crear-iso-1.3.sh base.iso AyusOS-Linux-1.3-candidata-amd64.iso
          sha256sum --check AyusOS-Linux-1.3-candidata-amd64.iso.sha256
          xorriso -indev AyusOS-Linux-1.3-candidata-amd64.iso -report_el_torito plain
      - uses: actions/upload-artifact@v4
        with:
          name: AyusOS-Linux-1.3-candidata-amd64
          path: |
            AyusOS-Linux-1.3-candidata-amd64.iso
            AyusOS-Linux-1.3-candidata-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
